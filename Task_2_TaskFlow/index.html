<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A responsive CRUD Task Manager built with HTML, CSS and JavaScript."
  >
  <title>TaskFlow | Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="brand">
        <h1>TaskFlow</h1>
        <p>Organize your work. Get things done.</p>
      </div>

      <div class="stats" aria-label="Task statistics">
        <div class="stat-card">
          <span class="stat-number" id="total-tasks">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="pending-tasks">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="completed-tasks">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="task-form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a New Task</h2>

      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Task Title</label>
          <input
            type="text"
            id="task-title"
            placeholder="What needs to be done?"
            required
            maxlength="100"
          >
        </div>

        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea
            id="task-description"
            placeholder="Add more details (optional)"
            maxlength="300"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-button">Add Task</button>
          <button type="button" id="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="controls-section" aria-label="Task controls">
      <div class="search-group">
        <label for="search-input" class="sr-only">Search tasks</label>
        <input
          type="search"
          id="search-input"
          placeholder="Search tasks..."
        >
      </div>

      <div class="filter-group">
        <label for="status-filter">Status</label>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>

        <label for="priority-filter">Priority</label>
        <select id="priority-filter">
          <option value="all">All Priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
    </section>

    <section class="tasks-section" aria-labelledby="tasks-heading">
      <div class="section-heading">
        <h2 id="tasks-heading">My Tasks</h2>
        <div class="task-actions">
          <button type="button" id="export-tasks">
            Export Backup
          </button>
          <button type="button" id="import-tasks">
            Import Backup
          </button>
          <input
            type="file"
            id="import-file"
            accept=".json,application/json"
            hidden
          >
          <button type="button" id="clear-completed" hidden>
            Clear Completed
          </button>
        </div>
      </div>

      <div id="task-list" class="task-list"></div>

      <div id="empty-state" class="empty-state">
        <h3>No tasks found</h3>
        <p>Add a new task to start organizing your work.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Built with HTML, CSS and JavaScript by Tajudeen Bawumia</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
